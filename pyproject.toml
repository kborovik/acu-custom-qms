[project]
name = "acuqms"
version = "0.5.3"
description = "Acumatica Cloud xRP customization package Lab5.QMS (build + tests)"
authors = [{ name = "Konstantin Borovik", email = "kb@lab5.ca" }]
license = "Apache-2.0"
requires-python = ">=3.14"
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
]

[project.scripts]
acuqms = "acuqms.cli:main"

# Required for uv to install this project (editable) and wire [project.scripts].
# Without a build system, `uv run acuqms` cannot resolve the console entry point.
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["acuqms*"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E402"]

[dependency-groups]
dev = [
    "ruff>=0.16.6",
]
